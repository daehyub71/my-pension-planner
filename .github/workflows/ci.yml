name: ci

on:
  push:
    branches: [main]
  pull_request:

# 읽기 권한만 — 시크릿을 쓰지 않는다 (배포 전 보안 점검)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: test (실데이터 테스트는 data/private 가 없어 건너뛴다)
        run: npm test
      - name: build + 네트워크 호출 검사 (postbuild)
        run: npm run build

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: stdio smoke (simulate·rules)
        run: npm run smoke
